name: health

# SPEC §8 M7: "health.yml — daily; fails loudly and opens an issue if the
# newest reading is >14 days old." This is the CI backstop behind the
# 60-day auto-disable mitigation: a `skipped` index entry keeps the repo
# committing so Actions never auto-disables, but that is not the same
# thing as the observatory's CONTENT staying fresh — this workflow watches
# that separately (packages/tiltmeter/src/core/health.ts's
# `newestRealReadingAt` explicitly does not count a skipped entry as "a
# reading landed").
#
# Reads only committed files — no ANTHROPIC_API_KEY anywhere in this file,
# so it is safe to run on any trigger; kept to schedule + workflow_dispatch
# for consistency with the rest of M7, not because it needs the guard.
#
# Committed but never executed by this build (HARD RULE: no live API call
# in this session — this workflow makes none anyway).
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    if: github.repository == 'jamessuuu/tiltmeter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tiltmeter build

      - name: check newest reading age (SPEC §8, >14 days)
        id: health
        run: node scripts/health-check.mjs

      # Only reached when the previous step exited non-zero (stale).
      # Idempotent: reuses an already-open "observatory stale" issue
      # instead of piling up a fresh one every day the condition holds.
      - name: open (or leave alone) the staleness issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create observatory-stale --color B60205 \
            --description "Newest reading is more than 14 days old (SPEC §8)" 2>/dev/null || true

          EXISTING=$(gh issue list --label observatory-stale --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "issue #$EXISTING is already open — leaving it, not filing a duplicate"
            exit 0
          fi

          # Built via printf, not a heredoc: a heredoc's closing delimiter must sit
          # at column 0, which silently breaks the YAML block scalar this step lives
          # in (every line here needs the run block's indentation to stay part of
          # it) -- confirmed live: this is why every past run of this step, on any
          # trigger, failed instantly with zero jobs ("workflow file issue"), and
          # why GitHub fell back to the file path instead of the `name: health`
          # declared above. js-yaml -- same parser this repo already depends on --
          # reproduces the exact failure on the old form and parses this form clean.
          BODY=$(printf '%s\n' \
            'The newest entry in `observatory/readings/index.json` that actually' \
            'produced a reading (not a `skipped` mitigation commit) is more than 14' \
            'days old (SPEC §8/§14 M7).' \
            '' \
            '**Likely causes:** `reading.yml` has been failing silently red without' \
            'anyone noticing, `ANTHROPIC_API_KEY` expired or was removed from repo' \
            'secrets, or the console workspace spend limit was hit and every recent' \
            'week recorded a cap-reached skip (see `docs/OPERATIONS.md`).' \
            '' \
            'Check recent runs of the `reading` workflow, then close this issue once a' \
            'real reading lands — it will not reopen itself; the next stale day (if the' \
            'underlying cause is not fixed) files a fresh one only if this one has been' \
            'closed.')

          gh issue create \
            --title "Observatory stale: newest reading is more than 14 days old" \
            --label observatory-stale \
            --body "$BODY"
