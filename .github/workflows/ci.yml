name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth-1) clone: the
          # suite-lint stage below (and tiltmeter verify's pre-registration
          # walk) resolve an item-immutability baseline by walking git log
          # on a suite file's path — a shallow clone would silently make
          # that walk see only the newest commit, which is exactly the kind
          # of "looks green, proves nothing" gap SPEC §3.1 Decision 2 exists
          # to prevent (docs/SPEC.md §3.1, §7).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The five stages (PROGRAM.md D6 / SPEC §12). Order is the argument:
      # typecheck -> lint -> unit -> e2e:smoke -> eval
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit
        run: pnpm test -- --project unit
      - name: e2e-smoke (Playwright against the real static export — SPEC §14 M6)
        run: |
          npx playwright install --with-deps chromium
          pnpm e2e
      - name: brand-drift
        # SPEC §13/BRAND-KIT.md: scripts/brand.mjs is deterministic (no
        # Math.random, no webfont, no network, no date stamping) — CI
        # regenerates the committed apps/web/public/brand/** assets and
        # fails on any byte drift, the same pattern as calibration-drift
        # below for the README block.
        run: |
          pnpm brand
          git diff --exit-code -- apps/web/public/brand
      - name: diagram-drift
        # DESIGN-DIRECTION.md: the axis-tuple mechanism diagram is generated
        # by scripts/diagram.mjs the same way scripts/brand.mjs is — no
        # Math.random, no webfont, no network, no date stamping — so CI
        # regenerates the committed apps/web/public/diagram/** asset and
        # fails on any byte drift, same pattern as brand-drift above.
        run: |
          pnpm diagram
          git diff --exit-code -- apps/web/public/diagram
      - name: eval
        # Classifier goldens (>=24 at 100% exact match) + the two calibration
        # gates (FPR <=5%/200, power >=90%/200) — SPEC §12. $0, offline,
        # FakeModelClient only.
        run: pnpm eval

      # Publish-shape guards: dist compiles, tarball resolves to dist/.
      - name: build
        run: pnpm build
      - name: suite-lint
        # SPEC §3.1 Decision 2 / SECURITY.md: item immutability is
        # tiltmeter's flagship anti-p-hacking mechanism — "checkable in CI
        # from git alone, which is the whole point" — but nothing actually
        # ran it in CI before this stage. Runs `tiltmeter lint` (which
        # includes the git-backed immutability check, not just schema/quota)
        # over every suite under observatory/suites/ and fails the build on
        # any violation, including a resolvable-but-unresolved baseline
        # (packages/tiltmeter/src/core/lint.ts's `immutability-baseline-unresolved`).
        run: pnpm suite-lint
      - name: pack-check
        run: pnpm ci:pack-check
      - name: calibration-drift
        # The committed README calibration block and evals/calibration/RESULTS.md
        # must render byte-for-byte from the committed
        # evals/calibration/results/latest.json (SPEC §12/§14 M3: the README
        # numbers cannot drift from what was actually simulated). Behavioural
        # drift — latest.json no longer matching a fresh run — is the `eval`
        # stage's job, above; this stage only checks the committed docs.
        run: pnpm calibration:check
      - name: lint-workflows
        # SPEC §9 fork-PR/secret-boundary row, security-critical (M7): fails
        # red if any .github/workflows/*.yml with an externally-triggerable
        # event (pull_request, pull_request_target, issue_comment, …)
        # references a secret without a workflow_dispatch-only job guard —
        # the mechanical version of "no workflow reachable by external input
        # ever sees ANTHROPIC_API_KEY" (SECURITY.md), checked on every push/PR
        # rather than relying on review alone.
        run: node scripts/lint-workflow-secrets.mjs

  # SPEC §12 "Live smoke — workflow_dispatch only: --sync --limit 2 --model
  # claude-haiku-4-5, ~$0.002. Never on PRs." SPEC §14 M4's own gate ships
  # this WIRED but UNEXECUTED: no ANTHROPIC_API_KEY secret is configured on
  # this repo yet, and `observatory/suites/` has nothing to plan against
  # until M5 lands. The `if` guards below mean this job never runs from a
  # fork PR (SECURITY.md's boundary) and safely no-ops even on a manual
  # dispatch until both are true. Never triggered in this session.
  live-smoke:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'jamessuuu/tiltmeter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tiltmeter build
      - name: live smoke (SPEC §12, ~$0.002; safely skips without a key or suites)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not configured on this repo yet — live smoke stays unexecuted (SPEC §14 M4)."
            exit 0
          fi
          if [ ! -d observatory/suites ] || [ -z "$(ls -A observatory/suites 2>/dev/null)" ]; then
            echo "observatory/suites/ is empty — nothing to plan against yet (lands at M5)."
            exit 0
          fi
          RUN_GROUP="smoke-$(date +%s)"
          node packages/tiltmeter/dist/cli/index.js plan --run-group "$RUN_GROUP" --mode sync
          node packages/tiltmeter/dist/cli/index.js run --plan "$RUN_GROUP"
