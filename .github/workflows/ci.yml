name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The five stages (PROGRAM.md D6 / SPEC §12). Order is the argument:
      # typecheck -> lint -> unit -> e2e:smoke -> eval
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit
        run: pnpm test -- --project unit
      - name: e2e-smoke
        # Becomes real in M6 when apps/web exists (Playwright against the
        # statically prerendered site). Kept as an explicit no-op stage, not
        # omitted, so the pipeline shape is stable from the first commit.
        run: echo "e2e:smoke lands in M6 (apps/web is deferred; deploys are James-gated). Stage intentionally green."
      - name: eval
        # Classifier goldens (>=24 at 100% exact match) + the two calibration
        # gates (FPR <=5%/200, power >=90%/200) — SPEC §12. $0, offline,
        # FakeModelClient only.
        run: pnpm eval

      # Publish-shape guards: dist compiles, tarball resolves to dist/.
      - name: build
        run: pnpm build
      - name: pack-check
        run: pnpm ci:pack-check
