<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 308" role="img" aria-labelledby="dtitle ddesc"><title id="dtitle">tiltmeter's axis tuple: one difference is a verdict, two is a refusal</title><desc id="ddesc">Two stacked comparisons of the same five-element axis tuple (suite, model, runner, presentation, sampling). Top: reading A and reading B differ on exactly one axis, model — the comparison resolves to a verdict (regressed, improved, or moved-within-noise). Bottom: reading A and reading B differ on two axes, suite and model at once — the comparison refuses to resolve and is published as cannot-attribute, drawn in amber because refusing to answer is the argument this project makes.</desc><rect width="900" height="308" fill="#FAF7F2"/><rect x="92" y="34" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="92" y="70" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="174" y="34" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="174" y="70" width="64" height="30" fill="#1A1712"/><rect x="256" y="34" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="256" y="70" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="338" y="34" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="338" y="70" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="420" y="34" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="420" y="70" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><text x="78" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1A1712" text-anchor="end">A</text><text x="78" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1A1712" text-anchor="end">B</text><path d="M498 67 H528" fill="none" stroke="#1A1712" stroke-width="2"/><path d="M528 62.5 L540 67 L528 71.5 Z" fill="#1A1712"/><rect x="540" y="33" width="210" height="68" fill="none" stroke="#1A1712" stroke-width="2"/><text x="645" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#1A1712" text-anchor="middle">verdict</text><text x="645" y="81" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#1A1712" text-anchor="middle">regressed / improved /</text><text x="645" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#1A1712" text-anchor="middle">moved-within-noise</text><text x="124" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">suite</text><text x="206" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">model</text><text x="288" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">runner</text><text x="370" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">present</text><text x="452" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">sampling</text><text x="92" y="136" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#5a5347" text-anchor="start">one axis differs (model) → attributable</text><path d="M92 156 H806" stroke="#E4DDD3" stroke-width="1" stroke-dasharray="3 3"/><rect x="92" y="182" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="92" y="218" width="64" height="30" fill="#1A1712"/><rect x="174" y="182" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="174" y="218" width="64" height="30" fill="#1A1712"/><rect x="256" y="182" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="256" y="218" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="338" y="182" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="338" y="218" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="420" y="182" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><rect x="420" y="218" width="64" height="30" fill="none" stroke="#1A1712" stroke-width="2"/><text x="78" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1A1712" text-anchor="end">A</text><text x="78" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1A1712" text-anchor="end">B</text><path d="M498 215 H528" fill="none" stroke="#B45309" stroke-width="3"/><path d="M528 210.5 L540 215 L528 219.5 Z" fill="#B45309"/><rect x="540" y="181" width="210" height="68" fill="none" stroke="#B45309" stroke-width="2"/><text x="645" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#B45309" text-anchor="middle">cannot-attribute</text><text x="645" y="229" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#1A1712" text-anchor="middle">reasons: suiteSpecHash +</text><text x="645" y="242" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#1A1712" text-anchor="middle">modelIdResolved</text><text x="124" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">suite</text><text x="206" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">model</text><text x="288" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">runner</text><text x="370" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">present</text><text x="452" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#1A1712" text-anchor="middle">sampling</text><text x="92" y="284" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#B45309" text-anchor="start">two axes differ (suite + model) → refused, not guessed</text></svg>
